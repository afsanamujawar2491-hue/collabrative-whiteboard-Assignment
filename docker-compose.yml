services:
  postgres:
    image: postgres:16-alpine
    container_name: whiteboard-postgres
    environment:
      POSTGRES_DB: whiteboarddb
      POSTGRES_USER: whiteboard
      POSTGRES_PASSWORD: whiteboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whiteboard -d whiteboarddb"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak-db:
    image: postgres:16-alpine
    container_name: whiteboard-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: whiteboard-keycloak
    command: start-dev --import-realm --spi-import-export-import-strategy=OVERWRITE_EXISTING
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./infra/keycloak/whiteboard-realm.json:/opt/keycloak/data/import/whiteboard-realm.json
    depends_on:
      keycloak-db:
        condition: service_healthy

  mailhog:
    image: mailhog/mailhog:latest
    container_name: whiteboard-mailhog
    profiles:
      - mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
  keycloak_data:
